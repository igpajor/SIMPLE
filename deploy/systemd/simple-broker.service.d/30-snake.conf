[Unit]
After=systemd-tmpfiles-setup.service
Requires=systemd-tmpfiles-setup.service

[Service]
EnvironmentFile=/etc/simple/snake-broker.env
SupplementaryGroups=simple-snake
ExecStart=
ExecStart=/usr/bin/python3 /opt/simple/broker/simple_broker.py --socket /run/simple-private/broker.sock --database /var/lib/simple/simple.db --snake-socket /run/simple-snake-private/identity.sock --snake-service-uid ${SNAKE_SERVICE_UID} --snake-service-gid ${SNAKE_SERVICE_GID}
ReadWritePaths=/run/simple-snake-private
